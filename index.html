<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技数码资讯日报</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .loading { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="gradient text-white py-8 px-4 text-center">
        <h1 class="text-3xl font-bold mb-2">🚀 科技数码资讯日报</h1>
        <p class="opacity-80" id="update-time">加载中...</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- 发布日历部分 -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold mb-6 flex items-center">
                <span class="mr-2">📅</span> 数码发布日历
            </h2>
            <div id="release-calendar" class="space-y-4">
                <div class="text-center text-gray-500 py-8">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </section>

        <!-- 热榜部分 -->
        <section>
            <h2 class="text-2xl font-bold mb-6 flex items-center">
                <span class="mr-2">🔥</span> 今日热榜
            </h2>
            <div id="hot-lists" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="text-center text-gray-500 py-8 col-span-2">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-gray-800 text-white py-6 mt-12 text-center">
        <p class="text-gray-400 text-sm">© 2026 科技数码资讯日报 | Powered by OpenClaw</p>
    </footer>

    <script>
        // 颜色配置
        const dateColors = [
            { bg: 'purple-600', light: 'purple-50' },
            { bg: 'blue-600', light: 'blue-50' },
            { bg: 'green-600', light: 'green-50' },
            { bg: 'orange-600', light: 'orange-50' },
            { bg: 'rose-600', light: 'rose-50' },
            { bg: 'cyan-700', light: 'cyan-50' }
        ];

        const platformColors = {
            'B站': { bg: 'pink-500', icon: '📺' },
            'B站热搜': { bg: 'pink-500', icon: '📺' },
            'B站日榜': { bg: 'pink-500', icon: '📺' },
            '微博': { bg: 'red-500', icon: '🔥' },
            '百度': { bg: 'blue-600', icon: '🔎' },
            'IT之家': { bg: 'red-700', icon: '💻' },
            '酷安': { bg: 'green-500', icon: '📱' },
            '抖音': { bg: 'black', icon: '🎵' },
            '头条': { bg: 'red-600', icon: '📰' },
            '知乎热榜': { bg: 'blue-500', icon: '💡' },
            '搜狗': { bg: 'orange-500', icon: '🔍' },
            '搜狐': { bg: 'yellow-600', icon: '🗞️' },
            '少数派': { bg: 'red-500', icon: '⚡' },
            'CSDN': { bg: 'red-700', icon: '💻' },
            '稀土掘金': { bg: 'blue-500', icon: '💎' },
            'GitHub': { bg: 'gray-800', icon: '⭐' },
            '网易新闻': { bg: 'red-600', icon: '📰' },
            'AcFun': { bg: 'orange-500', icon: '📺' },
            '爱范儿': { bg: 'gray-700', icon: '📱' },
            '51CTO': { bg: 'blue-700', icon: '💻' },
            '安全KER': { bg: 'green-700', icon: '🛡️' },
            '历史上的今天': { bg: 'amber-700', icon: '📜' }
        };

        // 格式化日期显示
        function formatDate(dateStr) {
            if (dateStr === '未公布') return '未公布';
            if (/^\d{4}年(上半年|下半年)$/.test(dateStr)) return dateStr;
            const exact = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (exact) return `${Number(exact[2])}月${Number(exact[3])}日`;
            const month = dateStr.match(/^(\d{4})-(\d{2})$/);
            if (month) return `${Number(month[2])}月`;
            return dateStr;
        }

        function releaseDateSortValue(dateStr) {
            const exact = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (exact) return Number(`${exact[1]}${exact[2]}${exact[3]}`);
            const month = dateStr.match(/^(\d{4})-(\d{2})$/);
            if (month) return Number(`${month[1]}${month[2]}99`);
            if (/上半年/.test(dateStr)) return 99990101;
            if (/下半年/.test(dateStr)) return 99990701;
            return 99999999;
        }

        function isUpcomingRelease(dateStr) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const exact = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (exact) {
                const target = new Date(Number(exact[1]), Number(exact[2]) - 1, Number(exact[3]));
                return target >= today;
            }
            const month = dateStr.match(/^(\d{4})-(\d{2})$/);
            if (month) {
                return Number(`${month[1]}${month[2]}`) >= Number(`${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}`);
            }
            if (/^\d{4}年上半年$/.test(dateStr)) return now.getMonth() < 6;
            if (/^\d{4}年下半年$/.test(dateStr)) return true;
            return dateStr === '未公布';
        }

        // 渲染发布日历
        function renderReleaseCalendar(products) {
            const container = document.getElementById('release-calendar');
            const upcomingProducts = (products || []).filter(product => isUpcomingRelease(product.releaseDate || '未公布'));

            if (!upcomingProducts.length) {
                container.innerHTML = `
                    <div class="text-center text-gray-500 py-8">
                        暂无待发布新品预告
                    </div>
                `;
                return;
            }

            // 按发布日期分组
            const grouped = {};
            upcomingProducts.forEach(product => {
                const rawDate = product.releaseDate || '未公布';
                const date = formatDate(rawDate);
                if (!grouped[date]) grouped[date] = { rawDate, products: [] };
                grouped[date].products.push(product);
            });

            // 按日期排序
            const sortedDates = Object.keys(grouped).sort((a, b) => {
                return releaseDateSortValue(grouped[a].rawDate) - releaseDateSortValue(grouped[b].rawDate);
            });

            // 渲染
            container.innerHTML = sortedDates.map((date, index) => {
                const color = dateColors[index % dateColors.length];
                const prods = grouped[date].products;

                return `
                    <div class="bg-white rounded-lg shadow p-4">
                        <h3 class="font-bold text-${color.bg} mb-3">${date}</h3>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            ${prods.map(p => `
                                <span class="bg-${color.light} px-2 py-1 rounded flex justify-between items-center">
                                    ${p.url ? `<a href="${p.url}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-600">${p.name}</a>` : `<span>${p.name}</span>`}
                                    <span class="text-xs text-gray-500">${p.heat}</span>
                                </span>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染热榜
        function renderHotLists(hotLists) {
            const container = document.getElementById('hot-lists');
            const platforms = Object.keys(hotLists).filter(key => hotLists[key].status === 'success' && hotLists[key].items?.length);

            container.innerHTML = platforms.map(platform => {
                const data = hotLists[platform];
                const color = platformColors[data.platform] || { bg: 'gray-500', icon: '📊' };
                const items = data.items || [];

                return `
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <div class="bg-${color.bg} text-white px-4 py-2 font-bold">
                            ${color.icon} ${data.platform}热门
                        </div>
                        <ul class="divide-y text-sm">
                            ${items.slice(0, 5).map((item, idx) => `
                                <li class="px-4 py-2 hover:bg-gray-50">
                                    <span class="font-bold text-gray-400 mr-2">${item.rank || idx + 1}.</span>
                                    ${item.url && item.url !== '#'
                                        ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-600">${item.title}</a>`
                                        : item.title}
                                    ${item.play ? `<span class="text-gray-400 text-xs ml-2">(${item.play})</span>` : ''}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }).join('');

            // 如果没有成功的热榜
            if (platforms.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-500 py-8 col-span-2">
                        暂无热榜数据
                    </div>
                `;
            }
        }

        function normalizeHotCache(payload) {
            const result = {};
            const sourceMap = {};
            (payload.sources || []).forEach(source => {
                sourceMap[source.id] = source;
            });

            (payload.items || []).forEach(item => {
                if (!item.sourceId) return;
                if (!result[item.sourceId]) {
                    const source = sourceMap[item.sourceId] || {};
                    result[item.sourceId] = {
                        status: source.status === 'failed' ? 'failed' : 'success',
                        platform: item.sourceName || source.name || item.sourceId,
                        items: []
                    };
                }

                result[item.sourceId].items.push({
                    rank: item.rank,
                    title: item.title,
                    play: item.hot || '',
                    url: item.url || '#'
                });
            });

            return result;
        }

        async function fetchJson(url) {
            const response = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`${url} 加载失败`);
            return response.json();
        }

        // 加载数据
        async function loadData() {
            try {
                const [data, hotCache] = await Promise.all([
                    fetchJson('./data.json'),
                    fetchJson('./data/hot-cache.json')
                ]);

                // 更新时间
                document.getElementById('update-time').textContent =
                    `发布日历 × 热榜聚合 | ${hotCache.updatedAt || data.updateTime} 更新`;

                // 渲染发布日历
                if (data.releaseCalendar && data.releaseCalendar.products) {
                    renderReleaseCalendar(data.releaseCalendar.products);
                }

                // 渲染热榜
                renderHotLists(normalizeHotCache(hotCache));

            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('update-time').textContent = '数据加载失败，请刷新重试';
                document.getElementById('release-calendar').innerHTML = `
                    <div class="text-center text-red-500 py-8">
                        数据加载失败，请稍后刷新页面
                    </div>
                `;
                document.getElementById('hot-lists').innerHTML = `
                    <div class="text-center text-red-500 py-8 col-span-2">
                        数据加载失败，请稍后刷新页面
                    </div>
                `;
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
